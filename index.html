
<button type="button" id="addImage" class="addImage">
  ＋ إضافة صورة للفحص
</button>

<div id="sourceMenu" class="sourceMenu hidden"
     role="group" aria-label="مصدر الصورة">

  <button type="button" id="openCamera" class="sourceOption">
    📷 التصوير بالكاميرا
  </button>

  <button type="button" id="openGallery" class="sourceOption">
    اختيار من الاستوديو
  </button>

  <button type="button" id="openFiles" class="sourceOption">
    اختيار من الملفات
  </button>

</div>

<input id="galleryInput" class="hidden"
       type="file" accept="image/*">

<input id="filesInput" class="hidden"
       type="file" accept="image/*">

<div id="cameraPanel" class="cameraPanel hidden">
  <video id="cameraVideo" autoplay playsinline muted></video>

  <button type="button" id="takePhoto">
    التقاط الصورة
  </button>

  <button type="button" id="closeCamera">
    إلغاء
  </button>
</div>
